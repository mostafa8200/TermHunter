name: Build Windows exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onefile --name TermHunter --collect-all customtkinter --collect-all wordfreq --collect-all pystray app.py
      - uses: actions/upload-artifact@v4
        with:
          name: TermHunter-Windows
          path: dist/TermHunter.exe
